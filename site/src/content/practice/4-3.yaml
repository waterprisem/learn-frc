# Practice bank for lesson 4.3 (Live tuning).
lesson: "4.3"
items:
  - type: symptom-cause
    prompt: "What is the most likely cause?"
    symptom: "You edit `Tuning/kP` in AdvantageScope. The gain changes for an instant, then returns to 0.08."
    choices:
      - "`kPPublisher.accept(...)` is being called inside `periodic()`."
      - "The subscriber default is wrong."
      - "`kP` can only be changed on a real robot."
      - "The CAN ID is wrong."
    answer: 0
    explain: "Publishing the constant every loop overwrites your edit about 50 times a second. Publish the starting values once, in the constructor."
    source: "Lab 5, troubleshooting"
  - type: symptom-cause
    prompt: "What is the most likely cause?"
    symptom: "The `Tuning` topics appear, but editing a gain never changes the flywheel."
    choices:
      - "`periodic()` never calls `grabConstantsFromNetworkTables()`, or the method does not call `.get()`."
      - "The robot battery is low."
      - "AdvantageScope is too old."
      - "`Constants.java` has a private constructor."
    answer: 0
    explain: "The topic changes, but nothing reads it back into the controller. The subscriber's `get()` has to run, every loop, before the new number can matter."
    source: "Lab 5, troubleshooting"
  - type: mcq
    prompt: "You tuned `kP` live to 0.11 and the flywheel is perfect. The robot reboots. What `kP` does it use?"
    choices:
      - "0.11, because NetworkTables remembers it."
      - "The value in `Constants.java`, because the code publishes it again at startup."
      - "Zero."
      - "Whatever AdvantageScope last showed."
    answer: 1
    explain: "Live values exist only while the program runs. On startup the constructor publishes the constants again, so unless you copy 0.11 into `Constants.java`, it is lost."
  - type: mcq
    prompt: "Which order is the live tuning workflow?"
    choices:
      - "Edit `Constants.java`, redeploy, watch the graph."
      - "Edit the value in the tool, watch the graph, repeat, then copy the final value into `Constants.java`."
      - "Copy the value into `Constants.java` first, then tune live."
      - "Edit live and leave it; restarting keeps the value."
    answer: 1
    explain: "The live edit and the graph are the fast loop. The copy back to `Constants.java` is the last step, and the one people forget."
  - type: fill-blank
    prompt: "Complete the subscriber so it falls back to the known-good kP until the topic has a value."
    code: |
      private final DoubleSubscriber kPSubscriber =
          loggingTable.getDoubleTopic("Tuning/kP").subscribe(____);
    blanks:
      - ["FlywheelConstants.PID_KP"]
    explain: "The argument to `subscribe` is the default. Using the matching constant keeps the robot on its saved gain when no one has edited the topic."
    source: "Lab 5, Step 3"
  - type: multi
    prompt: "Why remove or guard live tuning code before competition? Select all that apply."
    choices:
      - "Any tool on the robot network can write the topics."
      - "A gain left at an experimental value changes behavior with no code change."
      - "NetworkTables cannot run in a match."
      - "The final tuned values should live in `Constants.java`, where they are reviewed."
    answers: [0, 1, 3]
    explain: "NetworkTables runs fine in a match; the risk is unplanned edits and untracked values. Guarding the code and keeping final numbers in `Constants.java` keeps behavior predictable."
