# Practice bank for lesson 1.3 (Power: battery, breaker, PDH).
lesson: "1.3"
items:
  - type: mcq
    prompt: "A battery rests at 12.7 V and has an internal resistance of 0.02 Ω. About what voltage does it deliver while the robot draws 150 A?"
    choices:
      - "12.7 V"
      - "9.7 V"
      - "3.0 V"
      - "15.7 V"
    answer: 1
    explain: "Sag = 150 A × 0.02 Ω = 3 V. So the voltage is 12.7 − 3 = 9.7 V. Forgetting to subtract from the resting voltage gives 3.0 V."
  - type: symptom-cause
    prompt: "What is the most likely cause?"
    symptom: "Your robot pushes another robot, stutters for a moment, then works again. This repeats while you keep pushing."
    choices:
      - "The main breaker keeps tripping."
      - "Brownouts: heavy current sags the voltage below the roboRIO limit, and motors cut out until it recovers."
      - "The CAN bus has lost power."
      - "A PDH fuse has blown and been replaced."
    answer: 1
    explain: "A tripped breaker or blown fuse stays off until reset. A stutter that recovers by itself is the voltage dropping below 6.75 V and coming back."
  - type: mcq
    prompt: "What is the first thing to do in an electrical emergency?"
    choices:
      - "Unplug the PDH from CAN."
      - "Disable the robot in the Driver Station."
      - "Press the 120 A main breaker."
      - "Remove a fuse."
    answer: 2
    explain: "The main breaker cuts power to the whole robot. Disabling in software relies on the robot still working."
  - type: multi
    prompt: "Which of these make a brownout more likely?"
    choices:
      - "A tired battery"
      - "Many motors pushing hard at once"
      - "High current limits on every motor"
      - "A lower resting voltage target on the PDH"
    answers: [0, 1, 2]
    explain: "All three raise sag or lower the starting voltage. The PDH does not have a voltage target. It only distributes power."
  - type: mcq
    prompt: "Which part protects the wiring if a motor shorts out?"
    choices:
      - "The supply current limit in code"
      - "The stator current limit in code"
      - "The PDH breaker or fuse on that channel"
      - "The brownout threshold"
    answer: 2
    explain: "Software limits protect the motor and battery voltage, and they depend on the code running. Breakers and fuses are hardware and always act."
  - type: free
    prompt: "A teammate says, \"The 120 A main breaker protects us from brownouts.\" Explain what is wrong."
    modelAnswer: "A brownout is a voltage drop caused by heavy current, and it happens well below 120 A. The breaker only trips at a current that could overheat wiring. Current limits in code reduce brownouts."
    explain: "Brownouts and breaker trips are different problems. One is a low voltage the roboRIO protects itself from. The other is too much current for the wires."
