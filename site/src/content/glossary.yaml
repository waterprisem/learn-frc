# Glossary. Each entry: id → term, short (tooltip, ≤160 chars), optional long, lessons that teach it.
setpoint:
  term: Setpoint
  short: The value you want a mechanism to reach, such as a target speed or height.
  lessons: ["3.2"]
measurement:
  term: Measurement
  short: What a sensor says the mechanism is doing right now.
  lessons: ["3.2"]
error:
  term: Error
  short: Setpoint minus measurement. How far the mechanism is from where you want it.
  lessons: ["3.2"]
feedforward:
  term: Feedforward
  short: A prediction of the voltage a mechanism needs for the motion you asked for.
  lessons: ["3.4"]
feedback:
  term: Feedback
  short: A correction calculated from measured error, such as PID.
  lessons: ["3.3"]
can-id:
  term: CAN ID
  short: The unique number that identifies a device on the robot's CAN bus.
  lessons: ["1.5"]
subsystem:
  term: Subsystem
  short: A class that owns one mechanism's motors and sensors.
  lessons: ["2.2"]
command:
  term: Command
  short: A class or object that describes one robot behavior and runs through the scheduler.
  lessons: ["2.3"]
roborio:
  term: roboRIO
  short: The robot's computer. Your Java program runs on it, and you deploy code to it.
  lessons: ["1.1", "1.5"]
pdh:
  term: PDH
  short: Power Distribution Hub. Sends battery power to each device through its own protected channel.
  lessons: ["1.3"]
main-breaker:
  term: Main breaker
  short: The 120 A switch next to the battery that turns the whole robot on and off.
  lessons: ["1.3"]
internal-resistance:
  term: Internal resistance
  short: A small resistance inside the battery. It makes the voltage drop as current rises.
  lessons: ["1.3"]
voltage-sag:
  term: Voltage sag
  short: "The drop in battery voltage under load: resting voltage minus current times internal resistance."
  lessons: ["1.3"]
brownout:
  term: Brownout
  short: Battery voltage below 6.75 V (roboRIO 2). The roboRIO disables motor outputs until it recovers.
  lessons: ["1.3"]
current-limit:
  term: Current limit
  short: A motor controller setting that caps the amps a motor can draw.
  lessons: ["1.3", "1.4"]
motor-controller:
  term: Motor controller
  short: Electronics between your code and a motor. It takes requests over CAN and switches power into the motor.
  lessons: ["1.4"]
talonfx:
  term: TalonFX
  short: CTRE's motor controller, built into the Kraken X60. In code it is new TalonFX(canId).
  lessons: ["1.4"]
brushless-motor:
  term: Brushless motor
  short: A motor with no moving electrical contacts. A controller switches power into its windings.
  lessons: ["1.4"]
neutral-mode:
  term: Neutral mode
  short: "What a motor does at 0 output: coast (spins freely) or brake (resists turning)."
  lessons: ["1.4"]
stall:
  term: Stall
  short: A powered motor that is held still. It draws very high current.
  lessons: ["1.4"]
can-bus:
  term: CAN bus
  short: The shared two-wire network that links the roboRIO to motor controllers, sensors and the PDH.
  lessons: ["1.2", "1.5"]
terminating-resistor:
  term: Terminating resistor
  short: A 120 ohm resistor at each end of the CAN chain that stops signals reflecting back.
  lessons: ["1.5"]
deploy:
  term: Deploy
  short: Copy your built robot code from the laptop to the roboRIO and start it.
  lessons: ["1.5"]
imu:
  term: IMU
  short: Inertial measurement unit. Measures the robot's heading (yaw), pitch and roll.
  lessons: ["1.1"]
trigger:
  term: Trigger
  short: A condition, such as a button being held, that the scheduler checks every loop to start or stop a command.
  lessons:
    - "1.10"
vendordep:
  term: Vendordep
  short: A vendor library described by a JSON file in the project's vendordeps folder; Gradle downloads it when you build.
  lessons:
    - "1.11"
wpilib:
  term: WPILib
  short: The official FRC library and toolset - the robot loop, commands, control math, and the simulator.
  lessons:
    - "1.11"
periodic:
  term: periodic()
  short: A method WPILib calls about every 20 ms for as long as the robot code runs.
  lessons:
    - "1.12"
loop-overrun:
  term: Loop overrun
  short: A warning that robot code took longer than 20 ms to finish one pass of the loop.
  lessons:
    - "1.12"
abstraction-stack:
  term: Abstraction stack
  short: The layers between your Java code and the moving mechanism, each hiding the details of the one below.
  lessons:
    - "1.12"
robot-mode:
  term: Robot mode
  short: The state the Driver Station puts the robot in - Disabled, Autonomous, Teleoperated, or Test.
  lessons:
    - "1.13"
command-scheduler:
  term: Command scheduler
  short: The WPILib object that, each loop, runs active commands and every subsystem's periodic().
  lessons:
    - "1.13"
e-stop:
  term: Emergency stop (E-stop)
  short: Stops the robot immediately; it must be restarted before it can be enabled again.
  lessons:
    - "1.14"
relative-encoder:
  term: Relative encoder
  short: An encoder that counts movement from wherever it was at power-on, so it reads 0 there whatever the real position is.
  lessons:
    - "1.6"
absolute-encoder:
  term: Absolute encoder
  short: An encoder that reports the true angle of its shaft, even right after power-on. The CANcoder is a magnetic one.
  lessons:
    - "1.6"
homing:
  term: Homing
  short: Driving a mechanism slowly to a known place, such as a limit switch, then setting its position to a known value.
  lessons:
    - "1.6"
heading:
  term: Heading
  short: Which way the robot faces, measured by the IMU.
  lessons:
    - "1.6"
gear-ratio:
  term: Gear ratio
  short: Motor rotations per mechanism rotation. A ratio above 1, such as 10:1, is a reduction that trades speed for torque.
  lessons:
    - "1.8"
reduction:
  term: Reduction
  short: Gearing that turns the mechanism slower than the motor, giving more torque. A gear ratio above 1.
  lessons:
    - "1.8"
mechanism-units:
  term: Mechanism units
  short: The real units of the mechanism, such as meters of height or degrees of angle, instead of motor rotations.
  lessons:
    - "1.8"
robot-container:
  term: RobotContainer
  short: The class that creates the subsystems and controller and wires buttons to commands. Start here to learn what a button does.
  lessons:
    - "2.1"
telemetry:
  term: Telemetry
  short: Measurements the robot publishes (speed, position, status) so you can watch them live in a tool such as AdvantageScope.
  lessons:
    - "2.2"
command-lifecycle:
  term: Command lifecycle
  short: The four methods the scheduler calls on a command - initialize, execute, isFinished, end.
  lessons:
    - "2.3"
interrupted:
  term: Interrupted
  short: The flag passed to end(). True if the command was stopped from outside, false if isFinished() returned true.
  lessons:
    - "2.3"
scheduler:
  term: Scheduler
  short: The WPILib CommandScheduler. Once per 20 ms loop it starts, runs, and ends commands and runs every subsystem's periodic().
  lessons:
    - "2.4"
requirement:
  term: Requirement
  short: A subsystem a command declares with addRequirements. Only one command at a time may require a given subsystem.
  lessons:
    - "2.4"
binding:
  term: Binding
  short: A line of code that ties a trigger to a command, for example controller.a().whileTrue(command).
  lessons:
    - "2.5"
default-command:
  term: Default command
  short: The command a subsystem runs whenever no other command requires it.
  lessons:
    - "2.5"
driver-station:
  term: Driver Station
  short: The laptop application that enables the robot, picks the mode (Disabled, Teleop, Autonomous, Test), and sends joystick data.
  lessons:
    - "2.6"
networktables:
  term: NetworkTables
  short: WPILib's shared table of named values that robot code publishes and tools such as AdvantageScope read.
  lessons:
    - "2.6"
wpilib-simulator:
  term: WPILib simulator
  short: Runs the whole robot program on your laptop with a virtual Driver Station, so no robot hardware is needed.
  lessons:
    - "2.6"
control-request:
  term: Control request
  short: A Phoenix 6 object that tells a motor controller what to do, such as new VoltageOut(6.0), sent with setControl.
  lessons:
    - "2.7"
status-signal:
  term: Status signal
  short: A Phoenix 6 object holding a device reading, such as velocity. Call refresh() then getValueAsDouble().
  lessons:
    - "2.7"
inversion:
  term: Inversion
  short: A motor setting that decides which physical spin direction counts as positive.
  lessons:
    - "2.7"
open-loop:
  term: Open loop
  short: Control that sends a fixed output and never checks the result. Voltage in, speed whatever it turns out to be.
  lessons:
    - "2.8"
closed-loop:
  term: Closed loop
  short: Control that measures the result and adjusts the output to close the gap to the target.
  lessons:
    - "3.1"
follower-motor:
  term: Follower motor
  short: A second motor told to copy a leader motor, so two motors drive one mechanism from one set of control code.
  lessons:
    - "3.10"
ka:
  term: kA
  short: The feedforward term for acceleration, in volts per unit of acceleration. Helps the mechanism follow speed changes in a profile.
  lessons:
    - "3.10"
    - "3.11"
sysid:
  term: SysId
  short: System identification. Run fixed voltage tests, log the response, and fit feedforward constants (kS, kV, kA, kG) from the data.
  lessons:
    - "3.11"
quasistatic-test:
  term: Quasistatic test
  short: A SysId test with a slow voltage ramp, so acceleration is near zero and the result shows friction and speed effects.
  lessons:
    - "3.11"
dynamic-test:
  term: Dynamic test
  short: A SysId test with a sudden voltage step, so acceleration is large and the result shows kA.
  lessons:
    - "3.11"
motion-magic:
  term: Motion Magic
  short: A CTRE feature that runs a trapezoid motion profile inside the motor controller, using cruise velocity, acceleration, and jerk.
  lessons:
    - "3.12"
on-motor-control:
  term: On-motor control
  short: Running PID and feedforward inside the motor controller (about 1 kHz) instead of on the roboRIO (50 Hz).
  lessons:
    - "3.12"
jerk:
  term: Jerk
  short: How quickly acceleration changes. Limiting jerk smooths the start and end of a motion.
  lessons:
    - "3.12"
output:
  term: Output
  short: What a controller sends to the mechanism, such as a motor voltage.
  lessons:
    - "3.2"
tolerance:
  term: Tolerance
  short: The largest error you accept before saying a mechanism is at its setpoint.
  lessons:
    - "3.2"
pid:
  term: PID
  short: A feedback rule that adds a push from the present error (P), accumulated error (I), and the error's rate of change (D).
  lessons:
    - "3.3"
steady-state-error:
  term: Steady-state error
  short: The error that remains after a mechanism stops changing, because the controller needs some error to produce its output.
  lessons:
    - "3.3"
windup:
  term: Windup
  short: Integral term growing too large while the error cannot be removed, causing a big overshoot later.
  lessons:
    - "3.3"
ks:
  term: kS
  short: Static-friction feedforward gain, in volts. The small voltage needed to start a mechanism moving.
  lessons:
    - "3.4"
kv:
  term: kV
  short: Velocity feedforward gain, in volts per unit of speed. Voltage added for each RPS of target speed.
  lessons:
    - "3.4"
motion-profile:
  term: Motion profile
  short: A plan for how a mechanism moves from A to B over time, with limits on speed and acceleration.
  lessons:
    - "3.6"
trapezoid-profile:
  term: Trapezoid profile
  short: A motion profile that accelerates at the maximum acceleration, cruises at the maximum velocity, then decelerates. Its speed graph is a trapezoid.
  lessons:
    - "3.6"
goal:
  term: Goal
  short: The final position you ask a profiled controller to reach. It can jump instantly; the profiled setpoint follows it gradually.
  lessons:
    - "3.6"
    - "3.7"
profiled-setpoint:
  term: Profiled setpoint
  short: The position and velocity the motion profile wants right now. The PID chases it instead of the far-away goal.
  lessons:
    - "3.6"
    - "3.7"
profiled-pid-controller:
  term: ProfiledPIDController
  short: A WPILib class that combines a PID controller with a trapezoid profile. You give it a goal; it plans the setpoint.
  lessons:
    - "3.7"
kg:
  term: kG
  short: Feedforward gain for gravity. On an elevator, the constant voltage that holds the carriage up at any height.
  lessons:
    - "3.7"
arm-feedforward:
  term: ArmFeedforward
  short: WPILib feedforward for rotating arms. Its gravity term is kG times the cosine of the angle, so the angle must be in radians.
  lessons:
    - "3.8"
radians-trap:
  term: Radians trap
  short: Passing degrees into code that expects radians. It compiles and runs but gives wrong voltages at most angles.
  lessons:
    - "3.8"
at-goal:
  term: atGoal
  short: ProfiledPIDController check that the mechanism is within tolerance of the final goal, unlike atSetpoint which checks the profile's current point.
  lessons:
    - "3.9"
race-condition:
  term: Race condition
  short: A bug where the result depends on timing, such as a ready signal that is still true for an old goal.
  lessons:
    - "3.9"
static:
  term: static
  short: Belongs to the class itself, so you use it without creating an object (Math.abs, FlywheelConstants.PID_KP).
  lessons:
    - "0.4"
final:
  term: final
  short: A variable that cannot be reassigned after it is set.
  lessons:
    - "0.4"
package:
  term: Package
  short: A named folder of related classes. The package line at the top of a file must match its folder path.
  lessons:
    - "0.4"
import:
  term: Import
  short: A line that borrows a class from another package so the file can use it by its short name.
  lessons:
    - "0.4"
generics:
  term: Generic type
  short: A type with another type in angle brackets that says what it holds, like List of String.
  lessons:
    - "0.4"
enum:
  term: Enum
  short: A type with a fixed list of named values, like NeutralModeValue.Brake and Coast.
  lessons:
    - "0.4"
method-chaining:
  term: Method chaining
  short: Calling .withX().withY() in a row, where each call returns the same object so the next call can follow.
  lessons:
    - "0.4"
gradle:
  term: Gradle
  short: The build tool behind WPILib's build, deploy, and simulate commands. It compiles your code and runs the next step.
  lessons:
    - "0.6"
compiler:
  term: Compiler
  short: The program that translates your Java into something the computer can run, and refuses code that breaks the language's rules.
  lessons:
    - "0.6"
stack-trace:
  term: Stack trace
  short: The list of method calls, newest first, printed when a program crashes. It shows where the crash happened and how the code got there.
  lessons:
    - "0.6"
command-palette:
  term: Command palette
  short: The VS Code search box (Ctrl+Shift+P) where you type the name of a command, such as WPILib - Build Robot Code.
  lessons:
    - "0.6"
git:
  term: Git
  short: A tool that keeps a history of snapshots of your project and lets several people change it safely.
  lessons:
    - "0.7"
repository:
  term: Repository
  short: A project folder together with its full Git history.
  lessons:
    - "0.7"
commit:
  term: Commit
  short: One saved snapshot of the project in Git, with a short message saying what changed.
  lessons:
    - "0.7"
branch:
  term: Branch
  short: A separate line of work in Git that does not change the main code until it is merged.
  lessons:
    - "0.7"
pull-request:
  term: Pull request
  short: A request on GitHub to merge your branch into main, where teammates review and comment.
  lessons:
    - "0.7"
merge-conflict:
  term: Merge conflict
  short: What Git reports when two changes edit the same lines. You resolve it by choosing the right lines.
  lessons:
    - "0.7"
radian:
  term: Radian
  short: An angle unit where a full turn is 2π (about 6.28). WPILib trig and ArmFeedforward use radians. Degrees × π / 180.
  lessons:
    - "0.8"
vector:
  term: Vector
  short: A quantity with a direction, written as a speed and a direction or as an x part and a y part.
  lessons:
    - "0.8"
velocity:
  term: Velocity
  short: How fast position changes; the slope of a position graph.
  lessons:
    - "0.8"
acceleration:
  term: Acceleration
  short: How fast velocity changes; the slope of a velocity graph.
  lessons:
    - "0.8"
voltage:
  term: Voltage
  short: The electrical push. Robot code commands a voltage; a fresh battery is about 12 V.
  lessons:
    - "0.9"
current:
  term: Current
  short: The flow of electricity, in amps. Current produces motor torque and heat.
  lessons:
    - "0.9"
torque:
  term: Torque
  short: Turning force. A motor's torque roughly follows its current.
  lessons:
    - "0.9"
inertia:
  term: Inertia
  short: How strongly a heavy object resists changes in speed. It is why acceleration needs extra voltage (kA).
  lessons:
    - "0.9"
magic-number:
  term: Magic number
  short: A bare number in code whose meaning and unit you have to guess. Replace it with a named constant.
  lessons:
    - "4.1"
topic:
  term: Topic
  short: One named, typed value in NetworkTables, such as Velocity RPS, inside a table like Subsystems/FlywheelSubsystem.
  lessons:
    - "4.2"
publisher:
  term: Publisher
  short: An object that writes values to a NetworkTables topic. Create it once as a field.
  lessons:
    - "4.2"
subscriber:
  term: Subscriber
  short: An object that reads the latest value of a NetworkTables topic, or a default if it has none yet.
  lessons:
    - "4.2"
    - "4.3"
live-tuning:
  term: Live tuning
  short: Changing gains while the robot runs by reading them from NetworkTables, then copying the final values into Constants.java.
  lessons:
    - "4.3"
data-log:
  term: Data log
  short: A file the robot writes while it runs (a .wpilog) so you can graph what happened after the robot is off.
  lessons:
    - "4.6"
assertion:
  term: Assertion
  short: A line in a test that fails the test when a condition is false, such as the error being larger than allowed.
  lessons:
    - "4.7"
command-composition:
  term: Command composition
  short: Combining small commands with sequence, parallel, race, or deadline into one bigger command.
  lessons:
    - "5.1"
named-action:
  term: Named action
  short: A composed command a driver would call by name, such as Intake or Score Speaker, built in one place and bound to a button.
  lessons:
    - "5.1"
setpoint-specific-trigger:
  term: Setpoint-specific trigger
  short: A readiness trigger that checks the controller goal equals one named setpoint and the mechanism is at that goal.
  lessons:
    - "5.2"
active-side:
  term: Active side
  short: A field the actions read to decide which side of the robot to use; flipping it lets the same buttons work on both sides.
  lessons:
    - "5.3"
coupled-mechanisms:
  term: Coupled mechanisms
  short: Mechanisms that share space or load, such as an arm mounted on an elevator, so safe moves for one depend on the other.
  lessons:
    - "5.5"
    - "5.6"
pose:
  term: Pose (state)
  short: A named combination of setpoints for a superstructure, such as L4 = 1.08 m elevator and -20 degree arm.
  lessons:
    - "5.5"
    - "5.7"
travel-envelope:
  term: Travel envelope
  short: The range of arm angles (-25 to 50 degrees in Lab 10) in which the elevator is allowed to move freely.
  lessons:
    - "5.6"
state-machine:
  term: State machine
  short: Code organized as an enum of states, one wanted state, and one place that decides what each mechanism does.
  lessons:
    - "5.7"
sim-gui:
  term: Sim GUI
  short: The WPILib simulator window with panels for robot state, joysticks, and NetworkTables.
  lessons:
    - R.2
advantagescope:
  term: AdvantageScope
  short: A desktop tool that graphs robot data live from the simulator or a robot, or from a saved log file.
  lessons:
    - R.3
wpilog:
  term: WPILOG
  short: The log file format WPILib writes; AdvantageScope opens it with File, Open Log(s).
  lessons:
    - R.3
statement:
  term: Statement
  short: One instruction in Java, ending with a semicolon.
  lessons:
    - "0.2"
variable:
  term: Variable
  short: A named box that holds one value of a given type, such as a double or an int.
  lessons:
    - "0.2"
type:
  term: Type
  short: What kind of value a variable holds - double, int, boolean, String.
  lessons:
    - "0.2"
method:
  term: Method
  short: A named group of statements you run by calling its name, optionally with inputs and a returned answer.
  lessons:
    - "0.2"
camel-case:
  term: camelCase
  short: Naming style with a lowercase first word and capitalized later words, like targetRPS.
  lessons:
    - "0.2"
class:
  term: Class
  short: A blueprint that describes the fields and methods of one kind of object.
  lessons:
    - "0.3"
object:
  term: Object
  short: One real thing built from a class with new, such as one TalonFX.
  lessons:
    - "0.3"
field:
  term: Field
  short: A variable that belongs to an object and holds what it remembers.
  lessons:
    - "0.3"
override:
  term: "@Override"
  short: Marks a method that replaces one the parent class defines; the compiler checks the name matches.
  lessons:
    - "0.3"
interface:
  term: Interface
  short: A list of methods a class promises to have.
  lessons:
    - "0.3"
lambda:
  term: Lambda
  short: A small unnamed function written as () -> expression, handed over to run later.
  lessons:
    - "0.5"
supplier:
  term: Supplier
  short: A lambda that gives back a value when asked (BooleanSupplier, DoubleSupplier, Supplier of T).
  lessons:
    - "0.5"
runnable:
  term: Runnable
  short: A lambda that returns nothing and just does an action when called, like the code in Commands.runOnce.
  lessons:
    - "0.5"
method-reference:
  term: Method reference
  short: A shorter spelling of a lambda that only calls one method, written object::method with no parentheses.
  lessons:
    - "0.5"
effectively-final:
  term: Effectively final
  short: A local variable that never changes after being set. Lambdas may only use local variables like that.
  lessons:
    - "0.5"
field-coordinate-system:
  term: Field coordinate system
  short: WPILib's fixed field axes - origin at the blue wall's right corner, +X toward red, +Y left, counter-clockwise positive.
  lessons:
    - "6.1"
robot-frame:
  term: Robot frame
  short: Axes that move with the robot - +X forward, +Y left, counter-clockwise positive rotation.
  lessons:
    - "6.1"
operator-perspective:
  term: Operator perspective
  short: Which field direction counts as "forward" for the driver - 0 degrees on blue, 180 degrees on red.
  lessons:
    - "6.1"
chassis-speeds:
  term: ChassisSpeeds
  short: The whole robot's requested motion - vx (m/s forward), vy (m/s left), omega (rad/s counter-clockwise).
  lessons:
    - "6.2"
swerve-module-state:
  term: SwerveModuleState
  short: One wheel's target - a speed in m/s and a steering angle.
  lessons:
    - "6.2"
kinematics:
  term: Kinematics
  short: The geometry that turns the robot's requested motion into a speed and angle for each wheel.
  lessons:
    - "6.2"
swerve-module:
  term: Swerve module
  short: One steerable wheel unit - a drive motor, a steer motor, and a CANcoder reading the wheel angle.
  lessons:
    - "6.2"
field-relative:
  term: Field-relative driving
  short: Stick directions refer to the field, not the robot, so pushing away from you moves the robot away whichever way it faces.
  lessons:
    - "6.3"
deadband:
  term: Deadband
  short: A small zone around the stick center treated as zero, so noise does not move the robot.
  lessons:
    - "6.3"
swervegen:
  term: SwerveGen
  short: CTRE's Tuner X swerve project generator. It writes TunerConstants and the base drivetrain code from your hardware details.
  lessons:
    - "6.4"
tuner-constants:
  term: TunerConstants
  short: The generated file holding a swerve robot's CAN IDs, gear ratios, module positions, encoder offsets and gains.
  lessons:
    - "6.4"
encoder-offset:
  term: Encoder offset
  short: The encoder reading at which a swerve wheel points straight forward. Tuner X measures it with the wheels aligned.
  lessons:
    - "6.4"
odometry:
  term: Odometry
  short: Tracking the robot's pose by adding up wheel movement and gyro heading over time. Small errors accumulate.
  lessons:
    - "6.5"
pose-estimator:
  term: Pose estimator
  short: Blends odometry with vision measurements, weighting each by its standard deviation, to give one best pose.
  lessons:
    - "6.5"
standard-deviation:
  term: Standard deviation
  short: How much a measurement is distrusted. Smaller means more trusted and more influence on the pose.
  lessons:
    - "6.5"
drift:
  term: Drift
  short: Pose error that grows over time because odometry adds up small mistakes such as wheel slip and gyro error.
  lessons:
    - "6.5"
continuous-input:
  term: Continuous input
  short: A PID setting that treats angles as wrapping, so the error is the shortest way around (179 to -179 degrees is 2).
  lessons:
    - "6.6"
seed-field-centric:
  term: Seed field-centric
  short: A CTRE swerve call that makes the robot's current facing the new forward for field-centric driving.
  lessons:
    - "6.6"
apriltag:
  term: AprilTag
  short: A printed square pattern with an ID number, placed at a known field position so cameras can use it as a landmark.
  lessons:
    - "7.1"
photonvision:
  term: PhotonVision
  short: Software on the coprocessor that finds AprilTags in camera frames and sends the results to the roboRIO over NetworkTables.
  lessons:
    - "7.1"
pose-ambiguity:
  term: Pose ambiguity
  short: A score from 0 to 1 for how easily a single flat tag could be explained by two different robot positions. High means unreliable.
  lessons:
    - "7.2"
robot-to-camera:
  term: Robot-to-camera transform
  short: A Transform3d describing where the camera is mounted on the robot and which way it faces. You measure it and keep it as a constant.
  lessons:
    - "7.2"
path:
  term: Path
  short: A smooth curve through waypoints that the robot's position follows; heading is set separately.
  lessons:
    - "8.1"
waypoint:
  term: Waypoint
  short: An anchor point on a path plus control handles that bend the curve into and out of it.
  lessons:
    - "8.1"
trajectory:
  term: Trajectory
  short: A path plus constraints, giving a target speed and a time for every point along it.
  lessons:
    - "8.1"
path-constraints:
  term: Path constraints
  short: Limits on velocity, acceleration, and angular motion that PathPlanner uses to build a trajectory.
  lessons:
    - "8.1"
rotation-target:
  term: Rotation target
  short: A heading the robot should hold at a given point along a path.
  lessons:
    - "8.1"
goal-end-state:
  term: Goal end state
  short: The speed and heading a path ends with.
  lessons:
    - "8.1"
auto:
  term: Auto
  short: A PathPlanner command that chains paths and other commands for the autonomous period.
  lessons:
    - "8.1"
autobuilder:
  term: AutoBuilder
  short: PathPlannerLib class configured once with your drivetrain's pose, speeds, and drive methods so autos can run on it.
  lessons:
    - "8.2"
alliance-flipping:
  term: Alliance flipping
  short: Mirroring a path drawn on the blue side to the red side when the robot is on the red alliance.
  lessons:
    - "8.2"
auto-chooser:
  term: Auto chooser
  short: A dashboard dropdown (SendableChooser) that selects which auto command runs in autonomous.
  lessons:
    - "8.2"
event-marker:
  term: Event marker
  short: A named point on a path where your code starts a command while the robot keeps driving.
  lessons:
    - "8.3"
named-commands:
  term: Named commands
  short: PathPlannerLib's registry mapping a name string to a command, via NamedCommands.registerCommand.
  lessons:
    - "8.3"
bring-up:
  term: Bring-up
  short: The ordered first-enable routine that checks a new mechanism's wiring, directions and conversions before closing a loop.
  lessons:
    - "9.1"
sensor-phase:
  term: Sensor phase
  short: Whether the sensor reading counts up when the mechanism moves in the positive direction.
  lessons:
    - "9.1"
soft-limit:
  term: Soft limit
  short: A limit in software or motor configuration that stops the mechanism from being driven past a safe position.
  lessons:
    - "9.1"
pre-match-checklist:
  term: Pre-match checklist
  short: A fixed list the team confirms before every match - code deployed, autonomous selected, controllers, starting positions, battery, bumpers.
  lessons:
    - "9.2"
systemcore:
  term: SystemCore
  short: The robot controller that replaces the roboRIO in the 2027 control system.
  lessons:
    - "9.3"
